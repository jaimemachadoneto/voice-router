[project]
name = "voice-router"
version = "0.4.0"
description = "The Home Assistant voice router: turns a spoken command into the entities that it acts on."
requires-python = ">=3.14.2"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-homeassistant-custom-component==0.13.366",
  "openai>=1.50",
  # Home Assistant installs these at runtime from the manifest of the
  # `conversation` dependency. The test environment installs them here.
  "gazetteer-matcher==1.1.0",
  "hassil==3.12.1",
  "home-assistant-intents==2026.8.28",
]

[project.scripts]
voice-router = "voice_router.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voice_router = ["general_words.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
